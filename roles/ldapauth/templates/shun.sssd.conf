[sssd]
debug_level = 4
services = {{ common_ldapauth_sssd_services | join(', ') }}
domains = {{ common_ldapauth_sssd_domain }}

{% if "ssh" in common_ldapauth_sssd_services %}
[ssh]

{% endif %}
{% if "ifp" in common_ldapauth_sssd_services %}
[ifp]

{% endif %}
{% if "sudo" in common_ldapauth_sssd_services %}
[sudo]

{% endif %}
{% if "nss" in common_ldapauth_sssd_services %}
[nss]
filter_groups = root
filter_users = root
entry_cache_nowait_percentage = 75
{% endif %}
{% if "pam" in common_ldapauth_sssd_services %}
[pam]
{% endif %}
[domain/{{ common_ldapauth_sssd_domain }}]
id_provider = ldap
auth_provider = ldap
chpass_provider = ldap
sudo_provider = ldap

enumerate = True
cache_credentials = True
case_sensitive = false

ldap_uri = {{ common_ldapauth_uris }}
ldap_search_base = {{ common_ldapauth_search_base }}
ldap_default_bind_dn = {{ common_ldapauth_bind_dn }}

ldap_tls_reqcert = {{ common_ldapauth_tls_reqcert }}
ldap_id_use_start_tls = {{ common_ldapauth_id_use_start_tls }}
